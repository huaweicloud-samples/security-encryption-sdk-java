name: Sync GitCode → GitHub
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mirror GitCode repo
        env:
          SRC_REPO: https://gitcode.com/HuaweiCloudDeveloper/huaweicloud-encryption-sdk-java.git
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git config --global core.askpass ""
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 120

          # credential helper：github 用户名随便填，密码填token
          git config --global credential.helper '!f() {
            case "$1" in
              *github.com*)
                echo "username=bot"
                echo "password=${GH_TOKEN}"
                ;;
            esac
          }; f'

          git clone --mirror "${SRC_REPO}" temp_mirror
          cd temp_mirror
          git remote set-url origin "https://github.com/${GH_REPO}.git"
          git push --mirror origin

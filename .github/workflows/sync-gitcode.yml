name: Sync GitCode → GitHub
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 关键：允许actions bot推送代码
    steps:
      - name: Mirror GitCode repo
        env:
          # GitCode源仓库，私有仓库替换为带token格式
          SRC_REPO: https://gitcode.com/HuaweiCloudDeveloper/huaweicloud-encryption-sdk-java.git
          # GitHub内置token拼接仓库地址，不要用github.repository_url
          DST_REPO: https://${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          # 裸镜像克隆
          git clone --mirror "${SRC_REPO}" temp_mirror
          cd temp_mirror
          git remote set-url origin "${DST_REPO}"
          # 镜像推送全部分支、tag；会覆盖目标仓库，仅做镜像仓库使用
          git push --mirror origin
